[package]
name = "paa-rust-architecture-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A public Rust starter for the Personal AI Architecture"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "paa-demo"
path = "src/bin/paa-demo.rs"

[[bin]]
name = "paa-server"
path = "src/bin/paa-server.rs"

[[bin]]
name = "paa-check"
path = "src/bin/paa-check.rs"

[[bin]]
name = "paa-acceptance"
path = "src/bin/paa-acceptance.rs"

[[bin]]
name = "paa-validate"
path = "src/bin/paa-validate.rs"
